<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks Manager</title>
    <link
      rel="icon"
      sizes="16x16 32x32 48x48"
      type="image/png"
      href="../public/list.png"
    />
    <link rel="stylesheet" href="dist/style.css" />
  </head>
  <body>
    <div class="container">
      <form onsubmit="handleSubmit(event)" class="form" id="TaskForm">
        <div class="inputField">
          <label for="taskInput"><h5>Task</h5></label>
          <input type="text" name="" id="taskInput"  placeholder="Enter a task"/>
        </div>
        <input
          type="submit"
          value="add task"
          id="submitButton"
          class="scalingHover"
        />
      </form>

      <div class="TasksContainer">
        <div class="head">
          <h1 class="ListHeader"><i>Tasks</i></h1>
          <div class="buttonContainer">
            <button id="clearCompletedBtn">clear Completed</button>
            <button id="clearAllBtn">clear all</button>
          </div>
        </div>
        <ul class="TaskList" id="TaskList"></ul>
      </div>
    </div>
    <script src="./dist/script.js"></script>
  </body>
</html>
